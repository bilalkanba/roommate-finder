server:
  port: 8000

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  application:
    name: roommate-finder-backend

  datasource:
    url: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres
    username: postgres.yfnjxbdpnetcqbhgsqjb
    password: ${SUPABASE_DB_PASSWORD:bilalkanba123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://yfnjxbdpnetcqbhgsqjb.supabase.co/auth/v1/.well-known/jwks.json

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PATCH
      - DELETE
      - OPTIONS
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

logging:
  level:
    root: INFO
    com.bilalkanba: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN