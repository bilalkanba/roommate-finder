name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== Backend : lint + tests =====
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/

      - name: Run tests
        env:
          # Fake env vars pour que les tests puissent importer la config
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "fake"
          SUPABASE_SERVICE_ROLE_KEY: "fake"
          SUPABASE_JWT_SECRET: "fake-secret-for-tests"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          OPENAI_API_KEY: "fake"
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  # ===== Frontend : lint + build =====
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        env:
          VITE_API_URL: "http://localhost:8000/api/v1"
          VITE_SUPABASE_URL: "https://test.supabase.co"
          VITE_SUPABASE_ANON_KEY: "fake"
        run: npm run build

  # ===== Security scan (Dependabot alerts activés aussi via GitHub settings) =====
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'  # Ne fait pas échouer le CI (warning uniquement)
          severity: 'CRITICAL,HIGH'
