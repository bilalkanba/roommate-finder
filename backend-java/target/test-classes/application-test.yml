# Configuration specifique aux tests d'integration
# Loaded par @ActiveProfiles("test")

spring:
  # Executer schema.sql AVANT que Hibernate cree les tables
  # Necessaire pour creer les types ENUM Postgres custom
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    # Attendre que schema.sql soit execute avant de creer les tables
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  # Bypass la validation JWT dans les tests Repository
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost/dummy

logging:
  level:
    org.hibernate.SQL: WARN
    org.testcontainers: INFO
    com.github.dockerjava: WARN