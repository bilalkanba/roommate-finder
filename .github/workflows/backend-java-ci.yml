name: Backend Java CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-java-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend-java/**'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Docker
        run: docker --version

      - name: Compile with Maven
        working-directory: ./backend-java
        run: mvn -B compile

      - name: Run tests (unit + integration with Testcontainers)
        working-directory: ./backend-java
        run: mvn -B verify
        env:
          OPENAI_API_KEY: dummy-key-for-tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend-java/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend-java/target/site/jacoco/
          retention-days: 7