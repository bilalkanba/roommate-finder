# docker-compose.yml
# Lance tout l'environnement de dev en une commande : docker-compose up
#
# Services :
# - postgres : DB locale (utile en dev, en prod on utilise Supabase cloud)
# - backend  : API FastAPI
# - frontend : app React Vite
#
# Le frontend communique avec le backend via http://localhost:8000
# Le backend communique avec la DB via le network interne "postgres:5432"

version: "3.9"

services:
  # ===== Base de données Postgres (dev local) =====
  # En prod, on pointe directement vers Supabase via DATABASE_URL
  postgres:
    image: postgres:16-alpine
    container_name: rf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-roommate_finder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Backend FastAPI =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override pour pointer vers le service postgres du compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roommate_finder}
    env_file:
      - ./backend/.env
    volumes:
      # Hot reload en dev : les changements dans app/ sont pris en compte
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    # Override la commande pour activer --reload en dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ===== Frontend React =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rf-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      # Hot reload : les changements dans src/ sont pris en compte
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  postgres_data:
